name: Lint & build
on:
  workflow_dispatch:
  push:
    tags:
      - v*
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CACHE_KEY: 'hugo-hinode-template'
  CACHE_PATH_DEBIAN: '/tmp/hugo_cache_runner'
  CACHE_PATH_WIN: '~\AppData\Local\hugo_cache'
  CACHE_PATH_MAC: '/Users/runner/Library/Caches/hugo_cache'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    # [24/AUG/23] Adjusted from npm ci to prevent EBADPLATFORM error due to fsevents
    - name: Install npm
      run: npm i

    - name: Lint the source files
      run: npm run lint      

  build:
    needs: lint

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [20.x, 22.x]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ">1.0.0"

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Dart Sass
      env:
        DART_SASS_VERSION: "1.98.0"
      run:  |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo snap install dart-sass
        elif [ "$RUNNER_OS" == "macOS" ]; then
          case "$(uname -m)" in
            arm64) SASS_ARCH="macos-arm64" ;;
            x86_64) SASS_ARCH="macos-x64" ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          SASS_INSTALL_DIR="${RUNNER_TEMP}/dart-sass-${DART_SASS_VERSION}"
          SASS_ARCHIVE="${RUNNER_TEMP}/dart-sass-${DART_SASS_VERSION}-${SASS_ARCH}.tar.gz"
          mkdir -p "$SASS_INSTALL_DIR"
          curl -fsSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-${SASS_ARCH}.tar.gz" \
            -o "$SASS_ARCHIVE"
          tar -xzf "$SASS_ARCHIVE" -C "$SASS_INSTALL_DIR"
          "$SASS_INSTALL_DIR/dart-sass/sass" --version
          echo "$SASS_INSTALL_DIR/dart-sass" >> "$GITHUB_PATH"
        elif [ "$RUNNER_OS" == "Windows" ]; then
          choco install sass
        fi
      shell: bash

    # [24/AUG/23] Adjusted from npm ci for non-macOS to prevent EBADPLATFORM error due to fsevents
    - name: Perform clean install of npm
      run:  |
        if [ "$RUNNER_OS" == "macOS" ]; then
          npm ci
        else
          npm i
        fi
      shell: bash

    # Cache Hugo cachedir and resourcedir (configured in config/ci/hugo.toml) for each OS
    # No additional cache invalidation is needed, Hugo uses checksums itself
    - name: Use Hugo cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.os == 'Windows' && env.CACHE_PATH_WIN || runner.os == 'macOS' && env.CACHE_PATH_MAC || env.CACHE_PATH_DEBIAN }}
        key: ${{ runner.os }}-${{ env.CACHE_KEY }}
        restore-keys: |
          ${{ runner.os }}-${{ env.CACHE_KEY }}

    - name: Build main site
      run: npm run build:cache
